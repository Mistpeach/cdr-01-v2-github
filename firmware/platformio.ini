; ============================================================
; CDR01 移植固件（ESP32-S3 N16R8 + 6x SG90 直驱）
; PlatformIO 工程配置
; ============================================================

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- 16MB Flash + 8MB OPI PSRAM（N16R8）----
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    ; USB 模式：1 = Hardware CDC and JTAG（板级默认）。该模式下 USB-Serial/JTAG
    ; 始终存在，esptool 可自动复位烧录；串口可见性由固件的"双口日志镜像"保证
    ; （日志同时写 USB CDC 与 UART0/Serial0），不依赖 USB 模式。
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

; ---- 串口监控 ----
monitor_speed = 115200
monitor_filters = direct

; ---- 烧录 ----
upload_speed = 921600

; 说明：
; 1) 若你的板子实际是 N8R8（四线 PSRAM），把 memory_type 改为 qio_qspi、
;    psram_type 改为 qspi，其余不动。
; 2) 本项目不依赖任何第三方库（BLE/WiFi/LEDC/RMT/Preferences 均为 core 内置）。
